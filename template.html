<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioCode Commons</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="site-name">BioCode Commons</div>
    <nav aria-label="Contents">{{CONTENTS}}</nav>
  </aside>
  <header class="mobile-header">
    <div class="site-name">BioCode Commons</div>
    <details>
      <summary>Contents</summary>
      <nav aria-label="Mobile contents">{{CONTENTS}}</nav>
    </details>
  </header>
  <main>
    <h1>Important Bioinformatics Tools Should Be Well Maintained</h1>
    <div class="intro">
      <p class="mission">{{MISSION}}</p>
      <figure class="workflow-figure">
        <img src="maintenance-workflow.svg" width="400" height="292" alt="Original Pipeline/Toolkit, Maintain, Validate, Contribution Appreciated">
      </figure>
    </div>
    <section id="community" aria-labelledby="community-title">
      <h2 id="community-title">Community Engagement</h2>
      {{COMMUNITY}}
    </section>
    <section id="approach" aria-labelledby="approach-title">
      <h2 id="approach-title">Our Approach</h2>
      {{APPROACH}}
    </section>
  </main>
</body>
</html>
