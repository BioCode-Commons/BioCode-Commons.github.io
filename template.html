<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioCode Commons</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="site-name">BioCode Commons</div>
    <nav aria-label="Contents">{{CONTENTS}}</nav>
  </aside>
  <header class="mobile-header">
    <div class="site-name">BioCode Commons</div>
    <details>
      <summary>Contents</summary>
      <nav aria-label="Mobile contents">{{CONTENTS}}</nav>
    </details>
  </header>
  <main>
    <div class="intro">
      <p class="mission">{{MISSION}}</p>
      <figure aria-label="Illustration of a contribution history">
<svg viewBox="0 0 480 450" aria-hidden="true">
          <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d1d1ca"/></pattern></defs>
          <rect width="480" height="450" fill="url(#grid)"/>
          <g fill="none" stroke-width="3"><path class="trunk" d="M120 404V48" stroke="#343b35"/><path d="M120 333C120 280 302 300 302 226V91" stroke="#737aac"/><path d="M120 247C120 204 211 224 211 157V48" stroke="#97ab87"/><path d="M302 226C302 175 390 195 390 132V48" stroke="#737aac"/></g>
          <g fill="#f5f4ef" stroke="#343b35" stroke-width="3"><circle cx="120" cy="376" r="8"/><circle cx="120" cy="333" r="8"/><circle cx="120" cy="247" r="8"/><circle cx="120" cy="156" r="8"/><circle cx="120" cy="70" r="8"/></g>
          <g fill="#e4e9dd" stroke="#7c956a" stroke-width="3"><circle cx="211" cy="157" r="8"/><circle cx="211" cy="70" r="8"/></g>
          <g fill="#e3e4f2" stroke="#737aac" stroke-width="3"><circle cx="302" cy="226" r="8"/><circle cx="302" cy="113" r="8"/><circle cx="390" cy="70" r="8"/></g>
          <g font-family="ui-monospace, monospace" font-size="12" fill="#555b54"><text x="143" y="381">Original Pipeline/Toolkit</text><text x="143" y="162">Maintain</text><text x="326" y="231">Validate</text><text x="234" y="35">Contribution Appreciated</text></g>
          <circle class="pulse" cx="120" cy="70" r="16" fill="none" stroke="#7c956a" stroke-width="1.5"/>
        </svg>
      </figure>
    </div>
    <section id="community" aria-labelledby="community-title">
      <h2 id="community-title">Community Engagement</h2>
      {{COMMUNITY}}
    </section>
    <section id="approach" aria-labelledby="approach-title">
      <h2 id="approach-title">Our Approach</h2>
      {{APPROACH}}
    </section>
  </main>
</body>
</html>
